name: bones_api_db_users_benchmark
description: A Users API built with Bones_API, benchmarked against the memory, SQLite and PostgreSQL adapters.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  bones_api:
    path: ../..
  reflection_factory: ^2.13.0
  mercury_client: ^2.3.0
  args: ^2.7.0
  logging: ^1.3.0

# reflection_factory 2.13.0 isn't published yet: validated against its PR
# branch. Remove before releasing.
dependency_overrides:
  reflection_factory:
    git:
      url: https://github.com/gmpassos/reflection_factory.git
      ref: perf/json-decode-revived-args

dev_dependencies:
  build_runner: ^2.16.2
  build_verify: ^3.1.1
  lints: ^5.1.1
  test: ^1.31.1
