name: bones_api_db_users_benchmark
description: A Users API built with Bones_API, benchmarked against the memory, SQLite and PostgreSQL adapters.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  bones_api:
    path: ../..
  reflection_factory: ^2.10.1
  args: ^2.7.0
  logging: ^1.3.0

dev_dependencies:
  build_runner: ^2.15.0
  build_verify: ^3.1.1
  lints: ^5.1.1
  test: ^1.31.1
