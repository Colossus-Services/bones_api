name: bones_api
description: Bones_API - A powerful API backend framework for Dart. It comes with a built-in HTTP Server, route handler, entity handler, SQL translator, and DB adapters.
version: 1.29.1
homepage: https://github.com/Colossus-Services/bones_api

environment:
  sdk: '>=3.13.5 <4.0.0'

executables:
  bones_api:

dependencies:
  async_extension: ^1.2.22
  async_events: ^1.4.0
  reflection_factory: ^2.13.0
  statistics: ^1.2.2
  swiss_knife: ^3.3.14
  data_serializer: ^1.2.3
  shared_map: ^1.1.9
  graph_explorer: ^1.0.2
  ascii_art_tree: ^1.0.6
  map_history: ^1.0.7
  dart_spawner: ^1.1.0
  yaml_writer: ^2.1.0
  mercury_client: ^2.4.0
  project_template: ^1.1.1
  resource_portable: ^3.1.4
  docker_commander: ^3.1.0
  args_simple: ^1.1.0
  shelf_letsencrypt: ^2.0.8
  shelf: ^1.4.3
  shelf_gzip: ^4.1.0
  brotli_fast: ^1.0.0
  shelf_static: ^1.2.0
  args: ^2.7.0
  meta: ^1.19.0
  petitparser: ^7.1.0
  hotreloader: ^4.4.0
  logging: ^1.3.0
  collection: ^1.19.1
  mime: ^2.1.0
  postgres: ^3.5.20
  mysql1: ^0.20.0
  sqlite3: ^3.8.0
  gcloud: ^0.8.19
  yaml: ^3.1.4
  crypto: ^3.0.8
  path: ^1.9.1
  archive: ^4.5.2
  stream_channel: ^2.1.4
  http: ^1.6.0
  googleapis_auth: ^2.3.5
  _discoveryapis_commons: ^1.0.8
  crclib: ^3.0.0
  web: ^1.1.2
  async_locks: ^4.0.2
  timezone: ^0.11.2

dev_dependencies:
  lints: ^5.1.1
  build_runner: ^2.16.2
  build_verify: ^3.1.1
  test: ^1.33.0
  pubspec: ^2.3.0
  #dependency_validator: ^4.1.3
  coverage: ^1.16.0
  vm_service: ^15.4.0

