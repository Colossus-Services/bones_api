name: Dart CI

on:
  push:
    branches: [ master ]
  # Any base branch: also a PR stacked on another PR's branch.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      # A nested package: `dart analyze .` covers it, so it must be resolved too.
      - name: Install dependencies (benchmark/db_users)
        run: dart pub get
        working-directory: benchmark/db_users
      - name: dart format
        run: dart format -o none --set-exit-if-changed .
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: activate dependency_validator
        run: dart pub global activate dependency_validator
      - name: dependency_validator
        run: dart pub global run dependency_validator
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

  # The VM tests in parallel jobs: the Docker DB tests (the slowest, each
  # with its container) apart from the rest, which runs 4 files at a time
  # (`dart_test.yaml` has `concurrency: 1` for local runs with the DBs).
  # Each job uploads its coverage (merged by Codecov: see `codecov.yml`).
  #
  # The PostgreSQL/MySQL files run directly (a tag filter loads every test
  # file, and the DB files start Docker work while loading). The `docker`
  # job: the other files' `docker` tests (e.g. `bones_api_test_utils_test`).
  #
  # The `concurrency` job: parallel reads/stores and transactions on every
  # adapter (`bones_api_concurrency_*_test.dart`), its 3 files at once (the
  # in-process adapters, and the PostgreSQL and MySQL containers, started in
  # parallel).
  test_vm:
    name: test_vm (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # A hung test process (normally ~5 min) fails instead of running for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            args: -x docker -x concurrency -j 4
          - suite: postgres
            args: test/bones_api_enitity_db_postgres_test.dart
          - suite: mysql
            args: test/bones_api_entity_db_mysql_test.dart
          - suite: docker
            args: >-
              -t docker
              $(grep -lE "'docker'" test/*_test.dart
              | grep -vE 'db_postgres_test|db_mysql_test|_concurrency_')
          - suite: concurrency
            args: -j 3 test/bones_api_concurrency_*_test.dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (VM, ${{ matrix.suite }}) +coverage
        run: dart test --coverage=./coverage --platform vm ${{ matrix.args }}
      - name: Generate coverage report
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # `codecov-action` v4+ takes the token as an input
          # (it was an env var in v3):
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          flags: unittests
          env_vars: OS,DART
          fail_ci_if_error: true
          verbose: true


  # The Chrome tests split by test file across parallel jobs (each file is
  # compiled to JS, most of the time). In a job, one file at a time: in
  # parallel, Chrome times out loading suites. (Not `--total-shards`: it
  # splits the tests of every file, so each job would compile all of them.)
  test_chrome:
    name: test_chrome (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.7.2
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (Chrome, shard ${{ matrix.shard }}/3)
        run: |
          # The test files that run on Chrome (not `@TestOn('vm')`), every
          # 3rd one from this shard's index:
          files=$(grep -L "@TestOn('vm')" test/*_test.dart | sort | awk 'NR % 3 == ${{ matrix.shard }}')
          echo "$files"
          dart test --platform chrome $files
